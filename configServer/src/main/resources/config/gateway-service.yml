server:
  port: 8084
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**

            - id: activity-service
              uri: lb://activity-service
              predicates:
                - Path=/api/activities/**

            - id: ai-service
              uri: lb://ai-service
              predicates:
                - Path=/api/recommendations/**


